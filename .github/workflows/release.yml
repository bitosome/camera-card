name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: volta-cli/action@v4
      - run: yarn install --immutable
      - run: yarn run lint
      - run: yarn run test
      - run: yarn run build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/camera-card.js
          generate_release_notes: true
