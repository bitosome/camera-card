<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focused camera editor test</title>
    <style>
      :root {
        color-scheme: dark;
        --primary-color: #03a9f4;
        --primary-text-color: #f4f4f4;
        --secondary-text-color: #aeb6c2;
        --card-background-color: #20252b;
        --secondary-background-color: #171b20;
        --divider-color: #3a414a;
        --error-color: #ef5350;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        color: var(--primary-text-color);
        background: #101317;
        font-family: system-ui, sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 500px) minmax(320px, 1fr);
        gap: 24px;
        max-width: 1200px;
        margin: auto;
      }
      .panel {
        padding: 20px;
        border: 1px solid var(--divider-color);
        border-radius: 12px;
        background: var(--card-background-color);
      }
      h1,
      h2 {
        margin: 0 0 16px;
      }
      pre {
        max-height: 320px;
        overflow: auto;
        color: #c7d4e6;
        font-size: 11px;
        white-space: pre-wrap;
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script>
      class HaIcon extends HTMLElement {
        connectedCallback() {
          this.style.display = 'inline-grid';
          this.style.placeItems = 'center';
          this.style.width = '24px';
          this.style.height = '24px';
          this.textContent = '◆';
        }
      }

      class HaButton extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: 'open' });
          this.shadowRoot.innerHTML = `<style>
            button { min-height:36px; padding:0 14px; border:1px solid #65707e;
              border-radius:18px; color:#fff; background:#03a9f4; font:600 13px system-ui;
              cursor:pointer; } :host([appearance="outlined"]) button { background:transparent; }
          </style><button><slot></slot></button>`;
        }
      }

      class HaIconButton extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: 'open' });
          this.shadowRoot.innerHTML = `<style>
            button { display:grid; width:36px; height:36px; place-items:center; padding:0;
              border:0; border-radius:50%; color:#aeb6c2; background:transparent; cursor:pointer; }
            button:disabled { opacity:.35; cursor:not-allowed; }
          </style><button><slot></slot></button>`;
        }
        set label(value) {
          const button = this.shadowRoot.querySelector('button');
          button.setAttribute('aria-label', value ?? '');
          button.title = value ?? '';
        }
        set disabled(value) {
          this.shadowRoot.querySelector('button').disabled = Boolean(value);
        }
        get disabled() {
          return this.shadowRoot.querySelector('button').disabled;
        }
      }

      class HaSortable extends HTMLElement {}

      class HaForm extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: 'open' });
        }
        connectedCallback() {
          this._scheduleRender();
        }
        set hass(value) {
          this._hass = value;
        }
        set data(value) {
          this._data = structuredClone(value ?? {});
          this._scheduleRender();
        }
        get data() {
          return this._data ?? {};
        }
        set schema(value) {
          this._schema = value ?? [];
          this._scheduleRender();
        }
        set computeLabel(value) {
          this._computeLabel = value;
          this._scheduleRender();
        }
        set computeHelper(value) {
          this._computeHelper = value;
          this._scheduleRender();
        }
        _scheduleRender() {
          if (this._renderPending) return;
          this._renderPending = true;
          queueMicrotask(() => {
            this._renderPending = false;
            if (this.isConnected) this._render();
          });
        }
        _fields(schema) {
          return (schema ?? []).flatMap((field) =>
            field.type === 'grid' ? this._fields(field.schema) : [field],
          );
        }
        _render() {
          const fields = this._fields(this._schema);
          this.shadowRoot.innerHTML = `<style>
            *, *::before, *::after { box-sizing:border-box; }
            form { display:grid; grid-template-columns:minmax(0,1fr);
              gap:12px; } label { display:grid; min-width:0; gap:5px; color:#d9dee5;
              font:13px system-ui; } input, select { width:100%; min-width:0; min-height:44px;
              padding:0 10px; border:1px solid #65707e; border-radius:4px; color:#f4f4f4;
              background:#171b20; font:14px system-ui; } input[type="checkbox"] { width:22px; }
            small { color:#aeb6c2; line-height:1.3; }
          </style><form></form>`;
          const form = this.shadowRoot.querySelector('form');
          fields.forEach((field) => {
            const label = document.createElement('label');
            const title = document.createElement('span');
            title.textContent = this._computeLabel?.(field) ?? field.name;
            label.append(title);
            const selector = field.selector ?? {};
            let control;
            if (selector.boolean) {
              control = document.createElement('input');
              control.type = 'checkbox';
              control.checked = Boolean(this.data[field.name]);
            } else if (selector.select) {
              control = document.createElement('select');
              (selector.select.options ?? []).forEach((option) => {
                const node = document.createElement('option');
                node.value = typeof option === 'string' ? option : option.value;
                node.textContent = typeof option === 'string' ? option : option.label;
                control.append(node);
              });
              control.value = this.data[field.name] ?? '';
            } else {
              control = document.createElement('input');
              control.type = selector.number ? 'number' : selector.text?.type ?? 'text';
              if (selector.number) {
                control.min = selector.number.min;
                control.max = selector.number.max;
              }
              control.value = this.data[field.name] ?? '';
            }
            control.setAttribute('aria-label', title.textContent);
            control.dataset.name = field.name;
            const update = () => {
              const value = selector.boolean
                ? control.checked
                : selector.number
                  ? Number(control.value)
                  : control.value;
              this._data = { ...this.data, [field.name]: value };
              this.dispatchEvent(
                new CustomEvent('value-changed', {
                  detail: { value: structuredClone(this._data) },
                  bubbles: true,
                  composed: true,
                }),
              );
            };
            control.addEventListener(selector.boolean ? 'change' : 'input', update);
            label.append(control);
            const helper = this._computeHelper?.(field);
            if (helper) {
              const small = document.createElement('small');
              small.textContent = helper;
              label.append(small);
            }
            form.append(label);
          });
        }
      }

      class HaCard extends HTMLElement {}
      class HaCameraStream extends HTMLElement {
        connectedCallback() {
          this.style.display = 'grid';
          this.style.placeItems = 'center';
          this.style.width = '100%';
          this.style.height = '100%';
          this.style.background =
            'linear-gradient(135deg, #172833, #2d5665 60%, #12202a)';
          this.innerHTML =
            '<span style="font:600 18px system-ui">Live stream preview</span>';
        }
      }

      customElements.define('ha-icon', HaIcon);
      customElements.define('ha-button', HaButton);
      customElements.define('ha-icon-button', HaIconButton);
      customElements.define('ha-sortable', HaSortable);
      customElements.define('ha-form', HaForm);
      customElements.define('ha-card', HaCard);
      customElements.define('ha-camera-stream', HaCameraStream);
    </script>
  </head>
  <body>
    <main>
      <div class="panel">
        <h1>Focused configuration editor</h1>
        <div id="editor"></div>
      </div>
      <div>
        <div class="panel">
          <h2>Card preview</h2>
          <div id="preview"></div>
        </div>
        <div class="panel" style="margin-top: 24px">
          <h2>Generated configuration</h2>
          <pre id="config"></pre>
        </div>
      </div>
    </main>
    <script type="module">
      import '/dist/camera-card.js';

      const config = {
        type: 'custom:camera-card',
        cameras: [
          {
            camera_entity: 'camera.g6_ptz_medium',
            title: 'G6 PTZ',
            live_provider: 'ha',
            dependencies: { cameras: ['g6_hd'] },
          },
          {
            camera_entity: 'camera.g6_ptz_hd',
            id: 'g6_hd',
            title: 'G6 PTZ HD',
            live_provider: 'ha',
            capabilities: { disable_except: ['substream'] },
          },
          {
            camera_entity: 'camera.g5_ptz_medium',
            title: 'G5 PTZ',
            live_provider: 'ha',
            dependencies: { cameras: ['g5_hd'] },
          },
          {
            camera_entity: 'camera.g5_ptz_hd',
            id: 'g5_hd',
            title: 'G5 PTZ HD',
            live_provider: 'ha',
            capabilities: { disable_except: ['substream'] },
          },
        ],
        focused: {
          button_size: 36,
          controls: {
            x: 90,
            y: 8,
            spacing: 8,
          },
          substream: {
            enabled: true,
            icon: 'mdi:high-definition',
            active_icon: 'mdi:standard-definition',
          },
          fullscreen: {
            enabled: true,
            icon: 'mdi:fullscreen',
            active_icon: 'mdi:fullscreen-exit',
          },
          preset_groups: [
            {
              camera: 'camera.g6_ptz_medium',
              device_id: 'device-g6',
              x: 50,
              y: 88,
              spacing: 12,
              presets: [
                { name: 'Home', icon: 'mdi:home' },
                { name: 'Corner', icon: 'mdi:vector-square' },
                { name: 'Back', icon: 'mdi:arrow-left' },
                { name: 'Carport', icon: 'mdi:car' },
              ],
            },
          ],
        },
      };

      const hass = {
        states: {
          'camera.g6_ptz_medium': {
            entity_id: 'camera.g6_ptz_medium',
            state: 'streaming',
            attributes: {},
          },
          'camera.g6_ptz_hd': {
            entity_id: 'camera.g6_ptz_hd',
            state: 'streaming',
            attributes: {},
          },
          'camera.g5_ptz_medium': {
            entity_id: 'camera.g5_ptz_medium',
            state: 'streaming',
            attributes: {},
          },
          'camera.g5_ptz_hd': {
            entity_id: 'camera.g5_ptz_hd',
            state: 'streaming',
            attributes: {},
          },
        },
        callService: async (...args) => console.info('Service call', ...args),
      };

      const card = document.createElement('camera-card');
      card.hass = hass;
      card.setConfig(config);
      document.querySelector('#preview').append(card);

      const editor = await customElements.get('camera-card').getConfigElement();
      editor.hass = hass;
      editor.setConfig(config);
      document.querySelector('#editor').append(editor);
      document.querySelector('#config').textContent = JSON.stringify(config, null, 2);

      editor.addEventListener('config-changed', (event) => {
        document.querySelector('#config').textContent = JSON.stringify(
          event.detail.config,
          null,
          2,
        );
        card.setConfig(event.detail.config);
        editor.setConfig(event.detail.config);
      });
    </script>
  </body>
</html>
